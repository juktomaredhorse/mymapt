
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 결혼 상대 결정하기💍</title>

  <!-- 카카오맵 SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JAVASCRIPT_KEY&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #333;
    }

    header {
      height: 65px;
      padding: 18px 24px;
      background: #f8e8ed;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      display: flex;
      height: calc(100vh - 65px);
    }

    .sidebar {
      width: 380px;
      min-width: 320px;
      padding: 18px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      padding: 12px 5px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.active {
      color: white;
      background: #d87591;
      border-color: #d87591;
      font-weight: bold;
    }

    .search-box {
      display: flex;
      gap: 6px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    .search-button {
      padding: 0 15px;
      border: none;
      border-radius: 7px;
      color: white;
      background: #d87591;
    }

    .location-button {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: #fff;
    }

    #status {
      margin: 15px 0;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }

    .place {
      padding: 14px 4px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place:hover {
      background: #fff6f8;
    }

    .place-name {
      margin-bottom: 6px;
      font-weight: bold;
    }

    .place-address {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    @media (max-width: 650px) {
      .container {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        height: 48vh;
        min-width: 0;
      }

      #map {
        height: 52vh;
        min-height: 300px;
      }
    }
  </style>
</head>

<body>
  <header>내 결혼 상대 결정하기💍</header>

  <main class="container">
    <section class="sidebar">
      <div class="tabs">
        <button class="tab active" id="generalTab"
          onclick="changeTab('general')">
          결혼정보회사
        </button>

        <button class="tab" id="remarriageTab"
          onclick="changeTab('remarriage')">
          재혼 전문 업체
        </button>
      </div>

      <div class="search-box">
        <input id="regionInput" type="text"
          placeholder="지역별로 알아보기"
          onkeydown="if(event.key === 'Enter') searchPlaces()">

        <button class="search-button" onclick="searchPlaces()">
          검색
        </button>
      </div>

      <button class="location-button" onclick="useCurrentLocation()">
        현재 위치로 검색
      </button>

      <div id="status">지도를 불러오는 중...</div>
      <div id="results"></div>
    </section>

    <div id="map"></div>
  </main>

  <script>
    // 지도와 검색에 필요한 변수
    let map;
    let placesService;
    let geocoder;
    let markers = [];
    let infoWindows = [];
    let currentTab = "general";
    let currentPosition = new kakao.maps.LatLng(37.5665, 126.9780);
    let searchRequestId = 0;

    // 탭별 검색어를 분리한다.
    const searchKeywords = {
      general: [
        "결혼정보회사",
        "결혼정보업체",
        "결혼정보사"
      ],
      remarriage: [
        "재혼정보회사",
        "재혼정보",
        "재혼전문"
      ]
    };

    // 지도 초기화
    function initMap() {
      const mapContainer = document.getElementById("map");

      map = new kakao.maps.Map(mapContainer, {
        center: currentPosition,
        level: 5
      });

      placesService = new kakao.maps.services.Places();
      geocoder = new kakao.maps.services.Geocoder();

      document.getElementById("status").textContent =
        "지역을 입력하거나 현재 위치를 사용해 검색해 보세요.";

      // 현재 위치 사용을 요청한다.
      useCurrentLocation();
    }

    // 탭 변경 시 기존 검색 결과를 지운다.
    function changeTab(tabName) {
      currentTab = tabName;

      document.getElementById("generalTab").classList.toggle(
        "active", tabName === "general"
      );

      document.getElementById("remarriageTab").classList.toggle(
        "active", tabName === "remarriage"
      );

      clearResults();
      searchPlaces();
    }

    // 이전 마커와 결과 목록을 제거한다.
    function clearResults() {
      searchRequestId++;

      markers.forEach(marker => marker.setMap(null));
      markers = [];
      infoWindows = [];

      document.getElementById("results").innerHTML = "";
    }

    // 현재 위치를 가져온다.
    function useCurrentLocation() {
      if (!navigator.geolocation) {
        document.getElementById("status").textContent =
          "현재 위치 기능을 사용할 수 없습니다. 지역을 직접 입력해 주세요.";
        return;
      }

      document.getElementById("status").textContent =
        "현재 위치를 확인하는 중...";

      navigator.geolocation.getCurrentPosition(
        position => {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentPosition);
          searchPlaces();
        },
        () => {
          document.getElementById("status").textContent =
            "위치 권한을 사용할 수 없습니다. 지역을 입력해 검색해 주세요.";
        }
      );
    }

    // 지역명으로 좌표를 찾은 뒤 검색한다.
    function searchPlaces() {
      const region = document.getElementById("regionInput")
        .value.trim();

      clearResults();

      const requestId = searchRequestId;

      if (!region) {
        searchByKeywords(currentPosition, requestId);
        return;
      }

      document.getElementById("status").textContent =
        "지역을 찾는 중...";

      geocoder.addressSearch(region, (data, status) => {
        if (requestId !== searchRequestId) return;

        if (status === kakao.maps.services.Status.OK && data.length) {
          const position = new kakao.maps.LatLng(
            data[0].y, data[0].x
          );

          currentPosition = position;
          map.setCenter(position);
          map.setLevel(5);

          searchByKeywords(position, requestId);
        } else {
          // 주소 검색에 실패하면 지역명 자체를 장소 검색으로 찾는다.
          placesService.keywordSearch(region, (data, status) => {
            if (requestId !== searchRequestId) return;

            if (status === kakao.maps.services.Status.OK && data.length) {
              const position = new kakao.maps.LatLng(
                data[0].y, data[0].x
              );

              currentPosition = position;
              map.setCenter(position);
              searchByKeywords(position, requestId);
            } else {
              document.getElementById("status").textContent =
                "지역을 찾지 못했어요. 예: 서울 강남구, 경기 고양시";
            }
          });
        }
      });
    }

    // 선택된 탭에 해당하는 검색어만 사용한다.
    function searchByKeywords(position, requestId) {
      const keywords = searchKeywords[currentTab];
      const allPlaces = new Map();
      let completed = 0;

      document.getElementById("status").textContent =
        currentTab === "general"
          ? "결혼정보회사를 검색하는 중..."
          : "재혼 전문 업체를 검색하는 중...";

      keywords.forEach(keyword => {
        // 지역을 입력한 경우 지역명과 검색어를 결합한다.
        const region = document.getElementById("regionInput")
          .value.trim();

        const query = region
          ? region + " " + keyword
          : keyword;

        placesService.keywordSearch(
          query,
          (data, status, pagination) => {
            if (requestId !== searchRequestId) return;

            if (status === kakao.maps.services.Status.OK) {
              data.forEach(place => {
                // 같은 장소는 중복으로 추가하지 않는다.
                if (!allPlaces.has(place.id)) {
                  allPlaces.set(place.id, place);
                }
              });

              // 첫 페이지 외에도 추가 페이지를 요청한다.
              if (pagination.hasNextPage) {
                pagination.nextPage();
              }
            }

            completed++;

            // 모든 키워드의 검색 요청이 끝나면 결과를 표시한다.
            if (completed === keywords.length) {
              displayResults(Array.from(allPlaces.values()));
            }
          },
          {
            location: position,
            radius: 20000,
            sort: kakao.maps.services.SortBy.DISTANCE,
            size: 15
          }
        );
      });
    }

    // 검색 결과 목록과 지도 마커를 표시한다.
    function displayResults(places) {
      const resultsElement = document.getElementById("results");
      resultsElement.innerHTML = "";

      if (places.length === 0) {
        document.getElementById("status").textContent =
          currentTab === "general"
            ? "검색 결과가 없습니다. 다른 지역을 입력해 보세요."
            : "재혼 관련 검색 결과가 없습니다. 다른 지역을 입력해 보세요.";
        return;
      }

      document.getElementById("status").textContent =
        "검색 결과 " + places.length + "곳";

      places.forEach(place => {
        const position = new kakao.maps.LatLng(place.y, place.x);

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        markers.push(marker);

        const infoWindow = new kakao.maps.InfoWindow({
          content: `
            <div style="padding:10px; min-width:150px;">
              <strong>${escapeHTML(place.place_name)}</strong>
              <div style="font-size:12px; margin-top:5px;">
                ${escapeHTML(place.road_address_name || place.address_name || "주소 정보 없음")}
              </div>
            </div>
          `
        });

        infoWindows.push(infoWindow);

        kakao.maps.event.addListener(marker, "click", () => {
          infoWindows.forEach(window => window.close());
          infoWindow.open(map, marker);
        });

        const item = document.createElement("div");
        item.className = "place";

        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent = place.place_name;

        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.appendChild(name);
        item.appendChild(address);

        item.addEventListener("click", () => {
          map.setCenter(position);
          map.setLevel(3);

          infoWindows.forEach(window => window.close());
          infoWindow.open(map, marker);
        });

        resultsElement.appendChild(item);
      });
    }

    // 정보창에 표시하는 문자열의 HTML 특수문자를 처리한다.
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    // 카카오맵 SDK가 로드된 뒤 지도를 초기화한다.
    kakao.maps.load(initMap);
  </script>
</body>
</html>
